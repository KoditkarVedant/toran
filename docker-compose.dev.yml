# Development: runs the real Go server from this folder, inside a Go container.
#   docker compose -f docker-compose.dev.yml up          then open http://localhost:9090  (Ctrl+C stops it)
#   TORAN_PORT=9191 docker compose -f docker-compose.dev.yml up    another port
# Edit index.html and refresh: the server reads it from disk on every request.
# After changing Go code, press Ctrl+C and run it again.
# Checks (gofmt, vet, tests) are in docs/development.md.
# (docker-compose.yml is different: it builds and runs the finished image.)
name: toran-dev
services:
  toran-dev:
    image: golang:1.24-alpine      # keep in step with the builder image in the Dockerfile
    init: true
    working_dir: /app/server
    # create a services.json from the sample on the first run
    command: sh -c "[ -f ../services.json ] || cp ../services.sample.json ../services.json; exec go run ."
    ports:
      - "${TORAN_PORT:-9090}:8080"
    environment:
      ROOT: /app
      ADDR: ":8080"
    volumes:
      - .:/app                         # your services.json, backups and uploads are created here (git ignores them)
      - gocache:/root/.cache/go-build  # keeps rebuilds fast
      - gomod:/go/pkg/mod
volumes:
  gocache:
  gomod:
