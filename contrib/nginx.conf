server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Always revalidate so edits to the page/config show up on refresh.
    add_header Cache-Control "no-cache";

    # Wallpaper uploads (resized to a small JPEG by the page), LAN only.
    location /wallpaper/ {
        dav_methods PUT DELETE;
        create_full_put_path on;
        client_max_body_size 12m;
        add_header Cache-Control "no-cache";

        limit_except GET HEAD {
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            deny  all;
        }
    }

    # App logos the page copies from the icon CDN so they keep working offline, LAN only.
    location /icons/ {
        dav_methods PUT;
        create_full_put_path on;
        client_max_body_size 2m;
        add_header Cache-Control "public, max-age=86400";

        limit_except GET HEAD {
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            deny  all;
        }
    }

    # Allow the page to save its config with PUT, from the local network only.
    location = /services.json {
        dav_methods PUT;
        create_full_put_path on;
        client_max_body_size 1m;
        add_header Cache-Control "no-store";

        limit_except GET HEAD {
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            deny  all;
        }
    }
}
