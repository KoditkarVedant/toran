# Delivery.
#   push to main    -> image :edge on GitHub Container Registry
#   push of v1.2.3  -> images :1.2.3, :1.2 and :latest, plus a GitHub Release with the Pi binaries
# Prerelease tags such as v0.2.0-rc.1 publish their own tag only (never :latest).
#
# Docker Hub is optional: set the repository variables DOCKERHUB_IMAGE (for example
# youruser/toran) and DOCKERHUB_USERNAME, and the secret DOCKERHUB_TOKEN. The token is a secret;
# the user name is public, so it is a plain variable and stays readable in logs.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: Publish image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Work out image names and version
        id: names
        run: |
          echo "ghcr=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-edge"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_IMAGE != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.names.outputs.ghcr }}
            ${{ vars.DOCKERHUB_IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: VERSION=${{ steps.names.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub Release with Pi binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: server/go.mod

      - name: Build binaries
        working-directory: server
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p ../dist
          # names match `uname -m` on the Pi, like build.ps1
          build() { # name goarch goarm
            CGO_ENABLED=0 GOOS=linux GOARCH="$2" GOARM="$3" \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "../dist/toran-$1" .
          }
          build aarch64 arm64 ""
          build armv7l  arm   7
          build armv6l  arm   6
          build x86_64  amd64 ""
          cd ../dist && sha256sum toran-* > SHA256SUMS

      - name: Package the page files
        run: tar -czf dist/toran-page.tar.gz index.html custom.css services.sample.json wallpapers stack.yml

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes $flags
